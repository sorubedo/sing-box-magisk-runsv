name: Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "sing-box channel"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - stable
          - prerelease
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sing-box binaries
        id: upstream
        run: bash fetch.sh "${{ github.event.inputs.channel || 'auto' }}"

      - name: Read upstream version
        id: prep
        run: |
          set -a; . out/upstream-versions.env; set +a
          echo "version=$SING_BOX_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$SING_BOX_TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$MODULE_CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Package per ABI
        run: bash package.sh

      - name: Write build summary
        env:
          SING_BOX_TAG: ${{ steps.prep.outputs.tag }}
          MODULE_VERSION: ${{ steps.prep.outputs.version }}
          MODULE_CHANNEL: ${{ steps.prep.outputs.channel }}
        run: |
          {
            echo "## sing-box-runsv build"
            echo
            echo "- Channel: $MODULE_CHANNEL"
            echo "- Module version: $MODULE_VERSION"
            echo "- sing-box upstream: $SING_BOX_TAG"
            echo "- Packages: arm64-v8a, armeabi-v7a, x86_64, x86"
            echo
            echo '```text'
            cat out/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-runsv-${{ steps.prep.outputs.version }}-arm64-v8a
          path: |
            out/sing-box-runsv-${{ steps.prep.outputs.version }}-arm64-v8a.zip
            out/SHA256SUMS
            out/upstream-versions.env
          if-no-files-found: error

      - name: Upload armeabi-v7a artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-runsv-${{ steps.prep.outputs.version }}-armeabi-v7a
          path: |
            out/sing-box-runsv-${{ steps.prep.outputs.version }}-armeabi-v7a.zip
            out/SHA256SUMS
            out/upstream-versions.env
          if-no-files-found: error

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-runsv-${{ steps.prep.outputs.version }}-x86_64
          path: |
            out/sing-box-runsv-${{ steps.prep.outputs.version }}-x86_64.zip
            out/SHA256SUMS
            out/upstream-versions.env
          if-no-files-found: error

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-runsv-${{ steps.prep.outputs.version }}-x86
          path: |
            out/sing-box-runsv-${{ steps.prep.outputs.version }}-x86.zip
            out/SHA256SUMS
            out/upstream-versions.env
          if-no-files-found: error
