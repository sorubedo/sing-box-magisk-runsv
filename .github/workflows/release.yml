name: Build and Release

# Two channels, mirroring sing-box upstream:
#   stable     -> publishes a normal GitHub release
#   prerelease -> publishes a GitHub pre-release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sing-box binaries
        id: upstream
        run: bash fetch.sh "${{ inputs.channel }}"

      - name: Read upstream version
        id: prep
        run: |
          set -a; . out/upstream-versions.env; set +a
          echo "version=$SING_BOX_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$SING_BOX_TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$MODULE_CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Package per ABI
        run: bash package.sh

      - name: Create release notes
        env:
          SING_BOX_TAG: ${{ steps.prep.outputs.tag }}
          MODULE_VERSION: ${{ steps.prep.outputs.version }}
          MODULE_CHANNEL: ${{ steps.prep.outputs.channel }}
        run: |
          {
            echo "## Build information"
            echo
            echo "| Component | Value |"
            echo "| --- | --- |"
            echo "| Module | sing-box-runsv |"
            echo "| Channel | $MODULE_CHANNEL |"
            echo "| Module version | $MODULE_VERSION |"
            echo "| sing-box upstream | [$SING_BOX_TAG](https://github.com/SagerNet/sing-box/releases/tag/$SING_BOX_TAG) |"
            echo
            echo "The module version and versionCode are derived from the upstream sing-box release."
            echo
            echo "## ABI packages"
            echo
            echo "| Asset suffix | Android / Magisk architecture |"
            echo "| --- | --- |"
            echo "| arm64-v8a | arm64 |"
            echo "| armeabi-v7a | arm |"
            echo "| x86_64 | x64 |"
            echo "| x86 | x86 |"
            echo
            echo "Each ZIP contains the binary for one ABI only. Download the asset matching the target device."
            echo
            echo "Requires [runsvdir-magisk](https://github.com/sorubedo/runsvdir-magisk) to be installed and rebooted first."
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat out/SHA256SUMS
            echo '```'
          } > out/release-notes.md

          cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.tag }} (runsv module)
          body_path: out/release-notes.md
          generate_release_notes: true
          files: |
            out/*.zip
            out/SHA256SUMS
            out/upstream-versions.env
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.prep.outputs.channel == 'prerelease' }}
